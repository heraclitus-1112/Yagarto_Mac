name: Release unsigned macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a stable tag from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run strict Swift tests
        run: |
          swift test -c debug -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build and audit Release app
        run: |
          scripts/build-app.sh Release
          scripts/audit-release-no-fakes.sh dist/Release/YagartoMacApp.app

      - name: Package app and checksum
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh \
            "$GITHUB_REF_NAME" \
            dist/Release/YagartoMacApp.app \
            dist/release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            "dist/release-assets/YagartoMacApp-${version}-macOS-arm64.zip" \
            dist/release-assets/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "YAGARTO Mac $version" \
            --notes "此版本未使用 Developer ID 签名、未经 Apple 公证。首次打开请按安装文档通过 Finder 明确允许；ARM 工具链、QEMU、GDB 与 OpenOCD 仍需按所用 profile 单独安装。"
